spring.application.name=asyn-code-judge
spring.datasource.url=jdbc:postgresql://localhost:5432/codejudge
spring.datasource.username=codejudge
spring.datasource.password=local_dev_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jpa.properties.hibernate.format_sql=true
judge.supported-languages=java,c++,python,javascript
server.error.include-stacktrace=never
server.error.include-message=never